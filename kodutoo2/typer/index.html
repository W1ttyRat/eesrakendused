<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typer</title>
    <link rel="stylesheet" href="style.css">
    <script src="typer.js" defer></script>

</head>

<body>
    <button id="toggleSide">Ava küljepaneel</button>
    <div id="pageLayout">
        <div id="gameContainer">
            <div id="name" class="container">
                <label for="name">Sisesta oma nimi</label>
                <input type="text" id="username">
                <input type="button" value="Salvesta" id="submitName">
            </div>

            <div id="counter" class="container">
                <div id="time">3</div>
            </div>

            <div id="info" class="container">
                <div id="wordCount">1/5</div>
            </div>

            <div id="wordContainer" class="container">
                <div id="word"></div>
                <div id="score"></div>
            </div>

            <div id="resultsContainer" class="container">
                <h2>Top 20</h2>
                <div id="results"></div>
            </div>
        </div>
        <div id="sideContainer">
            <div id="infoContainer">
                <label for="wordAmount">Sõnade kogus:</label>
                <input type="number" id="wordAmount" value="5" min="1" max="20">
                <label for="">Maksimu</label>
            </div>
        </div>
    </div>

</body>

</html>
